<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AvatarBox — Universal AI Platform & 3D Avatar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --bg: #05070a;
  --panel: rgba(14, 18, 26, 0.96);
  --bd: rgba(255, 255, 255, 0.08);
  --ac: #10b981;
  --ac2: #059669;
  --tx: #f3f4f6;
  --sub: #9ca3af;
  --danger: #ef4444;
  --danger-hover: #dc2626;
}

* { scrollbar-width: thin; scrollbar-color: rgba(16,185,129,.4) rgba(0,0,0,.2); box-sizing: border-box; }

body {
  background: var(--bg);
  background-image:
    radial-gradient(circle at 15% 15%, rgba(16,185,129,.12), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(59,130,246,.08), transparent 45%);
  color: var(--tx);
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
}

#game-container {
  width: 100vw;
  height: 100vh;
  max-width: 1020px;
  max-height: 740px;
  background: var(--panel);
  backdrop-filter: blur(20px);
  border: 1px solid var(--bd);
  box-shadow: 0 35px 70px rgba(0,0,0,.8);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

@media (min-width: 768px) {
  #game-container { border-radius: 18px; width: 1020px; height: 740px; }
}

header {
  background: rgba(10,14,20,.85);
  padding: 12px 18px;
  font-size: 13px;
  font-weight: 600;
  border-bottom: 1px solid var(--bd);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Fira Code', monospace;
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
}
.brand span { color: var(--ac); }

.header-actions { display: flex; gap: 8px; align-items: center; }

.icon-btn {
  background: rgba(255,255,255,.06);
  border: 1px solid var(--bd);
  color: var(--tx);
  padding: 6px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  transition: background .15s, border-color .15s;
}
.icon-btn:hover { background: rgba(16,185,129,.2); border-color: var(--ac); }

.dot {
  width: 8px; height: 8px;
  background: var(--ac);
  border-radius: 50%;
  display: inline-block;
  box-shadow: 0 0 12px var(--ac);
  margin-right: 6px;
}

#app-layout { display: flex; flex: 1; overflow: hidden; position: relative; }

#sidebar {
  width: 240px;
  background: rgba(8,11,16,.7);
  border-right: 1px solid var(--bd);
  display: flex;
  flex-direction: column;
  padding: 14px;
  gap: 10px;
  flex-shrink: 0;
}

.menu-btn { display: none; }

@media (max-width: 767px) {
  #sidebar {
    position: absolute; z-index: 20;
    top: 0; bottom: 0; left: 0;
    transform: translateX(-100%);
    transition: transform .25s ease;
    background: #080b10;
    box-shadow: 8px 0 24px rgba(0,0,0,.5);
  }
  #sidebar.open { transform: none; }
  .menu-btn { display: inline-block; }
}

:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }

#sidebar h3 {
  font-size: 11.5px;
  color: var(--sub);
  text-transform: uppercase;
  margin: 0 0 4px;
  letter-spacing: .04em;
}

.history-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.history-item {
  background: rgba(255,255,255,.03);
  border: 1px solid var(--bd);
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  color: var(--sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background .15s, color .15s;
}
.history-item:hover { background: rgba(16,185,129,.12); color: #fff; }

.hi { display: flex; gap: 4px; }
.hi .history-item { flex: 1; }
.hi .x {
  height: auto;
  padding: 4px 8px;
  background: rgba(239,68,68,.15);
  color: #f87171;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}
.hi .x:hover { background: rgba(239,68,68,.3); }

#screen { flex: 1; padding: 14px; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
#main-content { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

/* Setup */
.setup {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  gap: 12px;
  overflow-y: auto;
  padding: 4px 8px 30px 4px;
}
.setup h1 { font-size: 18px; margin: 0; text-align: center; }
.setup p { color: var(--sub); font-size: 12px; margin: 0; text-align: center; }

.grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }

.ig {
  background: rgba(0,0,0,.3);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 11.5px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  border: 1px solid var(--bd);
}
.full { grid-column: 1 / -1; }

label { color: var(--sub); font-weight: 500; }

input[type=text],
input[type=password],
select,
textarea {
  background: rgba(10,14,20,.85);
  color: #fff;
  border: 1px solid var(--bd);
  padding: 7px 9px;
  font-family: 'Fira Code', monospace;
  border-radius: 6px;
  font-size: 12px;
  width: 100%;
  outline: none;
  transition: border-color .15s;
}
input:focus, select:focus, textarea:focus { border-color: var(--ac); }

input[type=color] {
  border: none;
  width: 100%;
  height: 28px;
  cursor: pointer;
  background: none;
  padding: 0;
}

.checks { display: flex; gap: 12px; flex-wrap: wrap; }
.checks label {
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  color: var(--tx);
  font-size: 11.5px;
}

.preview {
  display: flex;
